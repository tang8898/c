<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>tanwj 的小站</title>
  <link rel="icon" href="icon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css" />
  <style>
    :root { --accent:#11c5ff; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(1200px 600px at 50% 0%, #0b2033 0%, #0a1520 40%, #0a0f16 100%);
      color: #e9eef2;
    }
    .center-wrap {
      position: relative; z-index: 2;
      min-height: 100vh; display: grid; place-items: center; padding: 24px;
    }
    .card-landing {
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.08);
      box-shadow: 0 8px 40px rgba(0,0,0,.35);
      border-radius: 18px;
      padding: 40px 28px;
      text-align: center;
      max-width: 760px; width: 100%;
    }
    .title {
      font-weight: 900; letter-spacing: 2px; margin-bottom: 8px;
      font-size: clamp(28px, 6vw, 56px);
      text-shadow: 0 2px 18px rgba(0,255,255,.08), 0 0 2px rgba(255,255,255,.35);
    }
    .subtitle { color:#a9b2ba; margin-bottom: 24px; }
    .btn-primary {
      --bs-btn-bg: var(--accent);
      --bs-btn-border-color: var(--accent);
      --bs-btn-hover-bg: #0fb1e5;
      --bs-btn-hover-border-color: #0fb1e5;
      --bs-btn-focus-shadow-rgb: 17,197,255;
      padding: 12px 28px; font-weight: 700; letter-spacing: .5px;
    }
    /* 艺术透明水印 */
    .watermark {
      position: fixed; inset: 0; pointer-events: none; z-index: 1;
      display: grid; place-items: center;
      transform: rotate(-12deg);
      opacity: .55;
    }
    .watermark h1 {
      margin: 0; padding: 0;
      font-size: min(18vw, 180px);
      font-weight: 900;
      line-height: 1;
      letter-spacing: .08em;
      color: transparent; /* 透明填充 */
      -webkit-text-stroke: 2px rgba(255,255,255,.08); /* 描边 */
      text-shadow:
        0 6px 30px rgba(0,0,0,.35),
        0 0 60px rgba(17,197,255,.05);
      background: radial-gradient(600px 300px at 50% 50%, rgba(17,197,255,.08), rgba(0,0,0,0));
      -webkit-background-clip: text; background-clip: text;
    }
    .links { color:#7c8690; font-size: .95rem; }
    .links a { color:#a9b2ba; text-decoration: none; }
    .links a:hover { color:#ffffff; }
  </style>
</head>
<body>
  <!-- 艺术透明水印层 -->
  <div class="watermark"><h1>tanwj的小站</h1></div>
  
  <!-- 中心内容 -->
  <div class="center-wrap">
    <div class="card-landing">
      <div class="mb-2 text-info">WELCOME</div>
      <div class="title">tanwj 的小站</div>
      
      <a href="app.html" class="btn btn-primary btn-lg">B站抖音下载</a>
      <div class="links mt-4">
        如需直接访问功能页，也可进入
        <a href="pages/bilibili.html">哔哩哔哩</a> · 
        <a href="pages/douyin.html">抖音</a> · 
        <a href="pages/cloud.html">云端硬盘</a>
      </div>
    </div>
  </div>
</body>
</html>
